name: Android test

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Download latest APK
        run: |
          mkdir -p apk && cd apk
          curl -sSL -o zomboid.apk "https://github.com/${{ github.repository }}/releases/download/latest/zomboid.apk"
          ls -la
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_5
          disable-animations: true
          emulator-options: -no-window -gpu swangle_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            mkdir -p shots
            adb install -r apk/zomboid.apk
            adb shell settings put system accelerometer_rotation 0
            adb shell monkey -p com.c0bectb11.zomboid -c android.intent.category.LAUNCHER 1
            sleep 15
            adb exec-out screencap -p > shots/android_menu.png
            adb shell wm size
            adb shell input tap 1170 366
            sleep 20
            adb exec-out screencap -p > shots/android_game.png
            adb shell input swipe 400 800 600 700 1500
            sleep 3
            adb exec-out screencap -p > shots/android_walk.png
            adb logcat -d -s godot:* AndroidRuntime:E > shots/android_log.txt || true
      - name: Push screenshots
        if: always()
        run: |
          cd shots
          git init -q -b screens
          git config user.name gha
          git config user.email gha@users.noreply.github.com
          git add -A && git commit -qm "android test" && git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" screens
