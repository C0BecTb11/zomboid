name: Fetch Kenney assets

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Download Kenney Top-down Shooter (CC0)
        run: |
          set -x
          mkdir -p dl && cd dl
          page=$(curl -sL https://kenney.nl/assets/top-down-shooter)
          url=$(echo "$page" | grep -oE 'https://kenney.nl/media/pages/assets/top-down-shooter/[^"]+\.zip' | head -1)
          echo "kenney url: $url"
          if [ -n "$url" ]; then curl -sL -o pack.zip "$url"; fi
          if [ ! -s pack.zip ] || ! unzip -tq pack.zip; then
            ogurl=$(curl -sL https://opengameart.org/content/topdown-shooter | grep -oE 'https://opengameart.org/sites/default/files/[^"]+\.zip' | head -1)
            echo "oga url: $ogurl"
            curl -sL -o pack.zip "$ogurl"
          fi
          ls -la
          unzip -q pack.zip -d pack
          find pack -type f | sort > ../filelist.txt
          wc -l ../filelist.txt
      - name: Push pack to branch kenney-raw
        run: |
          mkdir out && cp -r dl/pack/* out/ && cp filelist.txt out/
          cd out
          git init -q -b kenney-raw
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A && git commit -qm "Kenney Top-down Shooter (CC0) raw"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" kenney-raw
