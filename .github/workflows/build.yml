name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew --no-daemon assembleRelease 2>&1 | tee build.log
          cp app/build/outputs/apk/release/app-release.apk zomboid.apk
      - name: Push build log on failure
        if: failure()
        run: |
          mkdir logout && grep -E "^e: |error:|What went wrong|^w: " -A3 build.log > logout/errors.txt || true
          tail -200 build.log > logout/tail.txt
          cd logout && git init -q -b buildlog && git config user.name gha && git config user.email gha@users.noreply.github.com
          git add -A && git commit -qm log && git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" buildlog
      - uses: actions/upload-artifact@v4
        with:
          name: zomboid-apk
          path: zomboid.apk
      - name: Publish to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Последняя сборка
          body: "Скачай zomboid.apk и установи на телефон."
          prerelease: false
          make_latest: true
          files: zomboid.apk
